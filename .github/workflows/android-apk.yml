name: Android APK

# Builds an installable debug APK of The Visual Lab on GitHub's runners, which ship with the
# Android SDK. Download it from the run's "Artifacts" section.
on:
  push:
    branches: [main, claude/visual-lab-game-rh1b8a]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # GitHub's ubuntu runners ship with the Android SDK (ANDROID_HOME) and accepted licences;
      # Gradle fetches any missing platform or build-tools automatically.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk the-visual-lab-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: the-visual-lab-apk
          path: the-visual-lab-debug.apk
          if-no-files-found: error
